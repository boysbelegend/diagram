<svg width="128" height="128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded rectangle background -->
  <rect width="128" height="128" fill="url(#grad1)" rx="24"/>

  <!-- Diagram nodes representation -->
  <circle cx="64" cy="35" r="14" fill="white" opacity="0.95"/>
  <circle cx="35" cy="85" r="14" fill="white" opacity="0.95"/>
  <circle cx="93" cy="85" r="14" fill="white" opacity="0.95"/>

  <!-- Connecting lines -->
  <line x1="64" y1="49" x2="35" y2="71" stroke="white" stroke-width="4" opacity="0.9" stroke-linecap="round"/>
  <line x1="64" y1="49" x2="93" y2="71" stroke="white" stroke-width="4" opacity="0.9" stroke-linecap="round"/>

  <!-- Small accent dots -->
  <circle cx="64" cy="64" r="3" fill="white" opacity="0.6"/>
</svg>
